spring.application.name=JobTrackerBE
spring.profiles.active=local

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

app.cors.allowed-origins=http://localhost:5173

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://hardy-ray-7293.clerk.accounts.dev/.well-known/jwks.json

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.servlet.multipart.file-size-threshold=1MB
server.tomcat.max-swallow-size=6MB

app.storage.max-file-size=5MB
app.storage.max-files-per-user=10

